repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and fix
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: Pyright strict
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
